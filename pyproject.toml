[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-orpheus"
version = "0.1.0"
description = "Persistent online multimodal physical world model research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Project Orpheus contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6",
  "Pillow>=10",
  "matplotlib>=3.7",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["world_model*"]

[tool.setuptools.package-data]
world_model = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "device: hardware-specific test",
  "slow: longer-running test",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["runs", "demo_outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]
