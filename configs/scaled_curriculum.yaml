project:
  name: orpheus-scaled-curriculum
  seed: 42
  output_dir: runs
  deterministic: true
device:
  preference: auto
  cuda_amp: false
  mps_float32: true
  compile: false
simulator:
  image_size: [64, 64]
  frame_rate: 20
  physics_rate: 120
  sequence_frames: 48
  min_objects: 2
  max_objects: 5
  radius_range: [0.16, 0.25]
  camera_motion: combined
  render_noise_std: 0.01
  ensure_collision: true
  scenario_mixture:
    - reference_pairs
    - baseline
    - elastic_pairs
    - damped_contacts
    - impulse_perturbation
    - camera_parallax
    - glancing_impacts
    - heavy_light_impacts
model:
  max_objects: 6
  state:
    geometry_dim: 8
    appearance_dim: 32
    residual_dynamics_dim: 16
    modal_count: 4
    modal_dim: 4
    parameter_memory_dim: 64
    global_dim: 16
  rgb:
    backbone_channels: [32, 64, 96, 144]
    feature_dim: 96
    proposal_queries: 8
    global_every_steps: 6
    roi_size: 20
    fast_depth_residual_enabled: false
    temporal_velocity_enabled: true
    temporal_velocity_history_size: 5
    temporal_velocity_min_samples: 3
    temporal_velocity_variance_scale: 1.5
    temporal_velocity_variance_floor: 0.04
    temporal_velocity_variance_ceiling: 0.25
    temporal_velocity_lateral_only: true
    temporal_velocity_unobserved_variance: 10000.0
    temporal_velocity_reset_on_collision: true
    temporal_velocity_max_age_steps: null
    temporal_velocity_post_event_max_samples: null
    temporal_velocity_measurement_position_blend: 0.5
    temporal_velocity_position_innovation_coupling: false
    structured_disc_center_enabled: true
    structured_disc_depth_relative_std: 0.08
    structured_disc_depth_outlier_relative_threshold: null
    structured_disc_depth_outlier_variance_scale: 9.0
    structured_disc_position_confidence: 0.995
  dynamics:
    hidden_dim: 160
    max_substep: 0.008333333333333333
  filter:
    hidden_dim: 192
  identification:
    hidden_dim: 64
runtime:
  modality: rgb
  enable_debug_oracle: false
training:
  batch_size: 1
  steps: 48000
  learning_rate: 0.0001
  closed_loop_learning_rate_scale: 0.1
  closed_loop_global_trainable_steps: 250
  closed_loop_trainable_scope: all
  weight_decay: 0.0001
  tbptt_steps: 8
  grad_clip_norm: 1.0
  checkpoint_every: 1000
  eval_every: 2000
  log_every: 10
  train_episodes: 4096
  validation_episodes: 256
  num_workers: 4
  fixed_dataset: false
  rgb_pretrain_steps: 8000
  measurement_validation_frames: 8
  perturbation_probability: 0.25
  perturbation_position_std: 0.12
  perturbation_velocity_std: 0.20
  collision_window_probability: 0.65
  long_horizon_window_probability: 0.80
  collision_positive_weight_max: 10.0
  horizon_weights: [1.0, 1.5, 2.0, 2.5, 3.0]
  loss_weights:
    measurement: 1.0
    state_position: 2.0
    state_velocity: 0.5
    rollout_position_x: 1.5
    rollout_position_y: 1.0
    rollout_position_z: 1.0
    rollout_velocity: 0.5
    event: 0.5
    parameter: 0.1
    existence: 0.3
    uncertainty: 0.1
    correction: 0.02
evaluation:
  horizons_seconds: [0.1, 0.25, 0.5, 0.75, 1.0]
  episodes: 256
  rgb_only: true
demo:
  seed: 200000
  max_frames: 48
  future_horizon_seconds: 1.0
  fps: 10
